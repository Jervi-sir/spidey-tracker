<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#031834" />

    <title>Hmmm Tracker — Live World Map</title>
    <meta
      name="description"
      content="Interact with the map to view sightings all over the world. A free retro pixel-art map — spin the globe and discover pins."
    />
    <link rel="canonical" href="https://spoodytracker.com/" />

    <!-- Google renders the 48px one and scales down; the .ico is the crawler fallback -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Speed up the first map paint -->
    <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin />
    <link rel="dns-prefetch" href="https://tiles.openfreemap.org" />

    <!-- Link previews (social cards) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Hmmm Tracker" />
    <meta property="og:url" content="https://spoodytracker.com/" />
    <meta property="og:title" content="Hmmm Tracker — Live World Map" />
    <meta
      property="og:description"
      content="Interact with the map to view sightings all over the world."
    />
    <!-- 1200x630. The square logo used to go here, but a summary_large_image
         card is ~1.91:1, so X cropped the top and bottom off it. -->
    <!-- <meta property="og:image" content="https://spoodytracker.com/og-card.png" /> -->
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Hmmm Tracker — a pixel-art globe with glowing sighting pins on it"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Hmmm Tracker — Live World Map" />
    <meta
      name="twitter:description"
      content="Interact with the map to view sightings all over the world."
    />
    <!-- <meta name="twitter:image" content="https://spoodytracker.com/og-card.png" /> -->
    <meta
      name="twitter:image:alt"
      content="Hmmm Tracker — a pixel-art globe with glowing sighting pins on it"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Hmmm Tracker",
        "url": "https://spoodytracker.com/",
        "applicationCategory": "EntertainmentApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript and WebGL",
        "description": "A live world map to view sightings all over the world with a retro pixel-art interface.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "isAccessibleForFree": true
      }
    </script>
  </head>
  <body>
    <div id="app"></div>

    <!--
      Crawlable copy for search engines and no-JS visitors. The live app
      replaces nothing here — it mounts into #app above — so this stays a
      truthful description of the page rather than hidden keyword filler.
    -->
    <noscript>
      <main class="noscript-intro">
        <h1>Spoody Tracker — a live world map of Spider-Man sightings</h1>
        <p>
          Spoody Tracker is a free, community-powered world map. Spot something?
          Drop a pin anywhere on Earth, write what you saw, add a photo, and it
          appears instantly for everyone else looking at the map.
        </p>
        <ul>
          <li>
            Spin a pixel-art globe and zoom from space down to your street.
          </li>
          <li>Post a sighting in seconds — no account, no sign-up.</li>
          <li>Like and reply to other people's reports.</li>
          <li>Works on phones and desktop, completely free.</li>
        </ul>
        <p>This page needs JavaScript enabled to show the interactive map.</p>
        <p>
          Unofficial fan project. Not affiliated with, endorsed by, or connected
          to Marvel, Sony Pictures, or any film studio. All artwork is original.
        </p>
      </main>
    </noscript>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
